<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07131C" />
    <meta
      name="description"
      content="SkyVoyage - One app. Every flight. Every airport. Every step of your journey."
    />
    <title>SkyVoyage — Smart Flight Booking & Travel Companion</title>
    <script>
      // GitHub Pages SPA fallback: decode "?/path" deep links (spa-github-pages technique).
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
  </head>
  <body style="background-color: #07131C">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
