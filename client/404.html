<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkyVoyage</title>
    <script>
      // GitHub Pages SPA fallback (spa-github-pages technique):
      // rewrite deep links like /skyvoyage/seat-selection to /skyvoyage/?/seat-selection
      // so index.html can restore them with history.replaceState.
      var pathSegmentsToKeep = 1; // "/skyvoyage"
      (function (l) {
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
            '/?/' +
            l.pathname
              .slice(1)
              .split('/')
              .slice(pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash,
        );
      })(window.location);
    </script>
  </head>
  <body></body>
</html>
